name: Ping Render Service

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.RENDER_URL }}
          method: 'GET'
          timeout: 10000
          
      - name: Log timestamp
        run: echo "Service pinged at $(date)"